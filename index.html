<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>ONANO · Inventario</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/jsx-source" id="app-source">
const { useState } = React;

/* ---------- icono minimalista, sin dependencias externas ---------- */
function Icon({ name, size = 16, className = "" }) {
  const paths = {
    dashboard: "M3 3h7v9H3zM14 3h7v5h-7zM14 12h7v9h-7zM3 16h7v5H3z",
    beaker: "M9 3h6M10 3v6l-6 9a2 2 0 002 3h12a2 2 0 002-3l-6-9V3",
    package: "M21 8l-9-5-9 5 9 5 9-5zM3 8v8l9 5 9-5V8M12 13v8",
    factory: "M3 21V10l6 4V10l6 4V6h6v15H3z",
    plus: "M12 5v14M5 12h14",
    x: "M18 6L6 18M6 6l12 12",
    check: "M20 6L9 17l-5-5",
    clock: "M12 22a10 10 0 100-20 10 10 0 000 20zM12 6v6l4 2",
    alert: "M12 9v4M12 17h.01M10.3 3.9L1.8 18a2 2 0 001.7 3h17a2 2 0 001.7-3L13.7 3.9a2 2 0 00-3.4 0z",
    chevron: "M9 18l6-6-6-6",
    boxes: "M2 8l8-4 8 4-8 4-8-4zM2 8v8l8 4M18 8v8l-8 4M18 8l-8 4",
    trash: "M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m3 0v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6h14z",
    truck: "M3 6h11v9H3zM14 10h4l3 3v2h-7zM7 19a2 2 0 100-4 2 2 0 000 4zM17.5 19a2 2 0 100-4 2 2 0 000 4z",
  };
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor"
      strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
      <path d={paths[name] || ""} />
    </svg>
  );
}

/* ---------- utilidades ---------- */
function fmt(n) {
  return new Intl.NumberFormat("es-MX").format(Math.round((Number(n) || 0) * 100) / 100);
}

function diasParaCaducar(fecha) {
  if (!fecha) return null;
  return Math.ceil((new Date(fecha) - new Date()) / 86400000);
}

const ESTADO_INFO = {
  solicitado: { label: "Solicitado", clase: "bg-stone-100 text-stone-600" },
  en_lab: { label: "En producción (Lab)", clase: "bg-amber-100 text-amber-800" },
  producido_pendiente: { label: "Producido — falta confirmar Global", clase: "bg-amber-100 text-amber-800" },
  confirmado: { label: "Confirmado — listo para envío", clase: "bg-teal-100 text-teal-800" },
  enviando: { label: "Envío en curso", clase: "bg-blue-100 text-blue-800" },
  completado: { label: "Completado", clase: "bg-green-100 text-green-800" },
};

/* ---------- capa de conexión con el backend real ---------- */
async function apiFetch(apiUrl, path, { token, method = "GET", body } = {}) {
  let res;
  try {
    res = await fetch(apiUrl + path, {
      method,
      headers: {
        "Content-Type": "application/json",
        ...(token ? { Authorization: "Bearer " + token } : {}),
      },
      body: body !== undefined ? JSON.stringify(body) : undefined,
    });
  } catch (e) {
    throw new Error("No se pudo conectar con el servidor (" + apiUrl + "). ¿Está corriendo el backend?");
  }
  let data = {};
  try { data = await res.json(); } catch (e) {}
  if (!res.ok) throw new Error(data.error || ("Error " + res.status));
  return data;
}

function mapOrden(o) {
  return {
    id: o.id,
    folio: o.folio,
    productoId: o.producto_id,
    cantidad: o.cantidad,
    estado: o.estado,
    confirmLab: !!o.confirm_lab,
    confirmGlobal: !!o.confirm_global,
    envios: (o.envios || []).map((e) => ({
      id: e.id,
      cantidad: e.cantidad,
      fecha: (e.enviado_en || "").slice(0, 10),
      recibido: !!e.recibido,
      fechaRecepcion: e.recibido_en ? e.recibido_en.slice(0, 10) : null,
    })),
    historial: (o.historial || []).map((h) => ({ evento: h.evento, fecha: (h.fecha || "").slice(0, 10) })),
  };
}

function mapProducto(p) {
  return { ...p, receta: (p.receta || []).map((r) => ({ materiaId: r.materia_id, cantidad: r.cantidad })) };
}

/* ---------- App ---------- */
function App() {
  const [apiUrl, setApiUrl] = useState("http://localhost:4000/api");
  const [token, setToken] = useState(null);
  const [usuario, setUsuario] = useState(null);
  const [tab, setTab] = useState("dashboard");

  const [materias, setMaterias] = useState([]);
  const [productos, setProductos] = useState([]);
  const [inventarioPT, setInventarioPT] = useState({});
  const [ordenes, setOrdenes] = useState([]);
  const [ordenesEnvio, setOrdenesEnvio] = useState([]);

  const [cargando, setCargando] = useState(false);
  const [errorCarga, setErrorCarga] = useState("");

  const [modalMateria, setModalMateria] = useState(false);
  const [modalProducto, setModalProducto] = useState(false);
  const [nuevaOrden, setNuevaOrden] = useState(false);
  const [nuevoEnvio, setNuevoEnvio] = useState(false);

  async function refrescarMaterias(tok) {
    const r = await apiFetch(apiUrl, "/materias", { token: tok || token });
    setMaterias(r.materias);
  }
  async function refrescarProductos(tok) {
    const r = await apiFetch(apiUrl, "/productos", { token: tok || token });
    setProductos(r.productos.map(mapProducto));
  }
  async function refrescarInventario(tok) {
    const r = await apiFetch(apiUrl, "/inventario-terminado", { token: tok || token });
    setInventarioPT(Object.fromEntries(r.inventario.map((x) => [x.producto_id, x.stock])));
  }
  async function refrescarOrdenes(tok) {
    const r = await apiFetch(apiUrl, "/ordenes-produccion", { token: tok || token });
    setOrdenes(r.ordenes.map(mapOrden));
  }
  async function refrescarOrdenesEnvio(tok) {
    const r = await apiFetch(apiUrl, "/ordenes-envio", { token: tok || token });
    setOrdenesEnvio(r.ordenes.map(mapOrden));
  }

  async function cargarTodo(tok) {
    setCargando(true);
    setErrorCarga("");
    try {
      await Promise.all([
        refrescarMaterias(tok),
        refrescarProductos(tok),
        refrescarInventario(tok),
        refrescarOrdenes(tok),
        refrescarOrdenesEnvio(tok),
      ]);
    } catch (e) {
      setErrorCarga(e.message);
    } finally {
      setCargando(false);
    }
  }

  async function ejecutar(accion) {
    try {
      await accion();
    } catch (e) {
      setErrorCarga(e.message);
    }
  }

  async function iniciarSesion({ email, password }) {
    try {
      const r = await apiFetch(apiUrl, "/auth/login", { method: "POST", body: { email, password } });
      setToken(r.token);
      setUsuario(r.usuario);
      await cargarTodo(r.token);
      return { ok: true };
    } catch (e) {
      return { ok: false, error: e.message };
    }
  }

  async function registrarCuenta({ email, password, empresa }) {
    try {
      const r = await apiFetch(apiUrl, "/auth/register", { method: "POST", body: { email, password, empresa } });
      setToken(r.token);
      setUsuario(r.usuario);
      await cargarTodo(r.token);
      return { ok: true };
    } catch (e) {
      return { ok: false, error: e.message };
    }
  }

  async function solicitarRecuperacion(email) {
    try {
      const r = await apiFetch(apiUrl, "/auth/forgot-password", { method: "POST", body: { email } });
      return { ok: true, ...r };
    } catch (e) {
      return { ok: false, error: e.message };
    }
  }

  async function restablecerPassword({ email, token: tk, password }) {
    try {
      const r = await apiFetch(apiUrl, "/auth/reset-password", { method: "POST", body: { email, token: tk, password } });
      return { ok: true, ...r };
    } catch (e) {
      return { ok: false, error: e.message };
    }
  }

  function cerrarSesion() {
    setToken(null);
    setUsuario(null);
    setMaterias([]); setProductos([]); setInventarioPT({}); setOrdenes([]); setOrdenesEnvio([]);
    setTab("dashboard");
  }

  if (!token || !usuario) {
    return (
      <Login apiUrl={apiUrl} setApiUrl={setApiUrl} onIngresar={iniciarSesion} onRegistrar={registrarCuenta}
        onOlvide={solicitarRecuperacion} onRestablecer={restablecerPassword} />
    );
  }

  const rol = usuario.empresa;

  async function agregarMateria(m) {
    await ejecutar(async () => {
      await apiFetch(apiUrl, "/materias", { token, method: "POST", body: m });
      await refrescarMaterias();
    });
  }
  async function eliminarMateria(id) {
    await ejecutar(async () => {
      await apiFetch(apiUrl, "/materias/" + id, { token, method: "DELETE" });
      await refrescarMaterias();
    });
  }
  async function agregarProducto(p) {
    await ejecutar(async () => {
      await apiFetch(apiUrl, "/productos", { token, method: "POST", body: p });
      await Promise.all([refrescarProductos(), refrescarInventario()]);
    });
  }
  async function eliminarProducto(id) {
    await ejecutar(async () => {
      await apiFetch(apiUrl, "/productos/" + id, { token, method: "DELETE" });
      await Promise.all([refrescarProductos(), refrescarInventario()]);
    });
  }
  async function crearOrden(productoId, cantidad) {
    await ejecutar(async () => {
      await apiFetch(apiUrl, "/ordenes-produccion", { token, method: "POST", body: { productoId, cantidad } });
      await refrescarOrdenes();
    });
  }
  async function labConfirmaProduccion(orden) {
    await ejecutar(async () => {
      await apiFetch(apiUrl, `/ordenes-produccion/${orden.id}/confirmar-produccion`, { token, method: "POST" });
      await Promise.all([refrescarOrdenes(), refrescarMaterias(), refrescarInventario()]);
    });
  }
  async function globalConfirmaLote(orden) {
    await ejecutar(async () => {
      await apiFetch(apiUrl, `/ordenes-produccion/${orden.id}/confirmar-lote`, { token, method: "POST" });
      await refrescarOrdenes();
    });
  }
  async function labEnviaParcial(orden, cantidad) {
    await ejecutar(async () => {
      await apiFetch(apiUrl, `/ordenes-produccion/${orden.id}/enviar`, { token, method: "POST", body: { cantidad } });
      await Promise.all([refrescarOrdenes(), refrescarInventario()]);
    });
  }
  async function globalConfirmaEnvio(orden, envioId) {
    await ejecutar(async () => {
      await apiFetch(apiUrl, `/ordenes-produccion/${orden.id}/envios/${envioId}/confirmar-recepcion`, { token, method: "POST" });
      await refrescarOrdenes();
    });
  }
  async function eliminarOrden(id) {
    if (!window.confirm("¿Eliminar esta orden de producción? Esta acción no se puede deshacer.")) return;
    await ejecutar(async () => {
      await apiFetch(apiUrl, "/ordenes-produccion/" + id, { token, method: "DELETE" });
      await refrescarOrdenes();
    });
  }

  async function crearSolicitudEnvio(productoId, cantidad) {
    await ejecutar(async () => {
      await apiFetch(apiUrl, "/ordenes-envio", { token, method: "POST", body: { productoId, cantidad } });
      await refrescarOrdenesEnvio();
    });
  }
  async function labConfirmaSolicitud(orden) {
    await ejecutar(async () => {
      await apiFetch(apiUrl, `/ordenes-envio/${orden.id}/confirmar-solicitud`, { token, method: "POST" });
      await refrescarOrdenesEnvio();
    });
  }
  async function labEnviaSolicitud(orden, cantidad) {
    await ejecutar(async () => {
      await apiFetch(apiUrl, `/ordenes-envio/${orden.id}/enviar`, { token, method: "POST", body: { cantidad } });
      await Promise.all([refrescarOrdenesEnvio(), refrescarInventario()]);
    });
  }
  async function globalConfirmaRecepcionSolicitud(orden, envioId) {
    await ejecutar(async () => {
      await apiFetch(apiUrl, `/ordenes-envio/${orden.id}/envios/${envioId}/confirmar-recepcion`, { token, method: "POST" });
      await refrescarOrdenesEnvio();
    });
  }
  async function eliminarOrdenEnvio(id) {
    if (!window.confirm("¿Eliminar esta solicitud de envío? Esta acción no se puede deshacer.")) return;
    await ejecutar(async () => {
      await apiFetch(apiUrl, "/ordenes-envio/" + id, { token, method: "DELETE" });
      await refrescarOrdenesEnvio();
    });
  }

  const stockBajo = materias.filter((m) => m.stock < m.minimo);
  const porCaducar = materias.filter((m) => {
    const d = diasParaCaducar(m.caduca);
    return d !== null && d <= 60 && d >= 0;
  });

  return (
    <div className="min-h-screen bg-stone-50 text-stone-900 flex">
      <Sidebar tab={tab} setTab={setTab} sesion={usuario} onCerrarSesion={cerrarSesion} />
      <main className="flex-1 p-8 max-w-6xl">
        {errorCarga && (
          <div className="mb-4 text-xs bg-red-50 border border-red-200 text-red-700 rounded-lg px-3 py-2 flex items-center justify-between">
            <span>{errorCarga}</span>
            <button onClick={() => setErrorCarga("")} className="text-red-400 hover:text-red-700"><Icon name="x" size={13} /></button>
          </div>
        )}
        {cargando && <p className="text-xs text-stone-400 mb-3">Cargando…</p>}

        {tab === "dashboard" && (
          <Dashboard materias={materias} productos={productos} ordenes={ordenes}
            stockBajo={stockBajo} porCaducar={porCaducar} setTab={setTab} />
        )}
        {tab === "materias" && (
          <MateriasPrimas materias={materias} onNueva={() => setModalMateria(true)} onEliminar={eliminarMateria} />
        )}
        {tab === "productos" && (
          <Productos productos={productos} materias={materias} onNuevo={() => setModalProducto(true)} onEliminar={eliminarProducto} />
        )}
        {tab === "inventario_pt" && <InventarioTerminado productos={productos} inventarioPT={inventarioPT} />}
        {tab === "ordenes" && (
          <Ordenes ordenes={ordenes} productos={productos} rol={rol}
            onNueva={() => setNuevaOrden(true)}
            onLabProduce={labConfirmaProduccion}
            onGlobalConfirma={globalConfirmaLote}
            onLabEnvia={labEnviaParcial}
            onGlobalRecibeEnvio={globalConfirmaEnvio}
            onEliminar={eliminarOrden} />
        )}
        {tab === "envios" && (
          <OrdenesEnvio ordenesEnvio={ordenesEnvio} productos={productos} rol={rol}
            onNueva={() => setNuevoEnvio(true)}
            onLabConfirma={labConfirmaSolicitud}
            onLabEnvia={labEnviaSolicitud}
            onGlobalRecibeEnvio={globalConfirmaRecepcionSolicitud}
            onEliminar={eliminarOrdenEnvio} />
        )}
      </main>

      {modalMateria && <ModalMateria onClose={() => setModalMateria(false)} onSave={agregarMateria} />}
      {modalProducto && (
        <ModalProducto materias={materias} onClose={() => setModalProducto(false)} onSave={agregarProducto} />
      )}
      {nuevaOrden && (
        <ModalOrden productos={productos} onClose={() => setNuevaOrden(false)}
          onCrear={(pid, cant) => { crearOrden(pid, cant); setNuevaOrden(false); }} />
      )}
      {nuevoEnvio && (
        <ModalOrdenEnvio productos={productos} inventarioPT={inventarioPT} onClose={() => setNuevoEnvio(false)}
          onCrear={(pid, cant) => { crearSolicitudEnvio(pid, cant); setNuevoEnvio(false); }} />
      )}
    </div>
  );
}

/* ---------- Sidebar ---------- */
function Sidebar({ tab, setTab, sesion, onCerrarSesion }) {
  const items = [
    { id: "dashboard", label: "Panel", icon: "dashboard" },
    { id: "materias", label: "Materias primas", icon: "beaker" },
    { id: "productos", label: "Productos y recetas", icon: "package" },
    { id: "inventario_pt", label: "Producto terminado", icon: "boxes" },
    { id: "ordenes", label: "Órdenes de producción", icon: "factory" },
    { id: "envios", label: "Órdenes de envío", icon: "truck" },
  ];
  return (
    <aside className="w-64 border-r border-stone-200 bg-white p-5 flex flex-col gap-6">
      <div>
        <p className="text-sm font-medium tracking-tight text-stone-900">ONANO · Inventario</p>
        <p className="text-xs text-stone-500 mt-0.5">Materia prima y producto terminado</p>
      </div>
      <nav className="flex flex-col gap-1">
        {items.map((it) => {
          const active = tab === it.id;
          return (
            <button key={it.id} onClick={() => setTab(it.id)}
              className={`flex items-center gap-2.5 px-3 py-2 rounded-lg text-sm text-left transition-colors ${active ? "bg-stone-900 text-white" : "text-stone-600 hover:bg-stone-100"}`}>
              <Icon name={it.icon} size={16} />
              {it.label}
            </button>
          );
        })}
      </nav>
      <div className="mt-auto">
        <p className="text-xs text-stone-400 mb-1">Sesión activa</p>
        <p className="text-sm font-medium">{sesion.empresa === "lab" ? "ONANO Lab" : "ONANO Global"}</p>
        <p className="text-xs text-stone-500 mb-2.5 truncate">{sesion.email}</p>
        <button onClick={onCerrarSesion} className="text-xs text-stone-500 hover:text-red-600 flex items-center gap-1">
          <Icon name="x" size={12} /> Cerrar sesión
        </button>
      </div>
    </aside>
  );
}

/* ---------- Dashboard ---------- */
function Dashboard({ materias, productos, ordenes, stockBajo, porCaducar, setTab }) {
  const pendientes = ordenes.filter((o) => o.estado !== "completado").length;
  return (
    <div className="space-y-8">
      <header>
        <h1 className="text-2xl font-medium tracking-tight">Panel general</h1>
        <p className="text-stone-500 text-sm mt-1">Datos en vivo del servidor</p>
      </header>
      <div className="grid grid-cols-4 gap-4">
        <Metric label="Materias primas" value={materias.length} icon="beaker" />
        <Metric label="Productos" value={productos.length} icon="package" />
        <Metric label="Órdenes activas" value={pendientes} icon="factory" />
        <Metric label="Alertas" value={stockBajo.length + porCaducar.length} icon="alert" tone="danger" />
      </div>
      <div className="grid grid-cols-2 gap-6">
        <div className="bg-white border border-stone-200 rounded-2xl p-5">
          <h2 className="text-sm font-medium mb-3 flex items-center gap-2">
            <Icon name="alert" size={15} className="text-amber-600" /> Stock bajo mínimo
          </h2>
          {stockBajo.length === 0 && <p className="text-sm text-stone-400">Sin alertas de stock.</p>}
          <div className="space-y-2">
            {stockBajo.map((m) => (
              <div key={m.id} className="flex items-center justify-between text-sm">
                <span>{m.nombre}</span>
                <span className="text-amber-700 font-medium">{fmt(m.stock)} / mín. {fmt(m.minimo)} {m.unidad}</span>
              </div>
            ))}
          </div>
          <button onClick={() => setTab("materias")} className="text-xs text-stone-500 mt-3 flex items-center gap-1 hover:text-stone-900">
            Ver catálogo completo <Icon name="chevron" size={12} />
          </button>
        </div>
        <div className="bg-white border border-stone-200 rounded-2xl p-5">
          <h2 className="text-sm font-medium mb-3 flex items-center gap-2">
            <Icon name="clock" size={15} className="text-red-600" /> Próximos a caducar (60 días)
          </h2>
          {porCaducar.length === 0 && <p className="text-sm text-stone-400">Sin lotes próximos a caducar.</p>}
          <div className="space-y-2">
            {porCaducar.map((m) => (
              <div key={m.id} className="flex items-center justify-between text-sm">
                <span>{m.nombre} · lote {m.lote}</span>
                <span className="text-red-700 font-medium">{m.caduca}</span>
              </div>
            ))}
          </div>
        </div>
      </div>
      <div className="bg-white border border-stone-200 rounded-2xl p-5">
        <h2 className="text-sm font-medium mb-3">Órdenes de producción en curso</h2>
        <div className="space-y-2">
          {ordenes.slice(0, 4).map((o) => {
            const producto = productos.find((p) => p.id === o.productoId);
            return (
              <div key={o.id} className="flex items-center justify-between text-sm py-1.5 border-b border-stone-100 last:border-0">
                <span className="font-medium">{o.folio}</span>
                <span className="text-stone-500">{producto?.nombre} · {fmt(o.cantidad)} u.</span>
                <EstadoBadge estado={o.estado} />
              </div>
            );
          })}
          {ordenes.length === 0 && <p className="text-sm text-stone-400">Todavía no hay órdenes.</p>}
        </div>
      </div>
    </div>
  );
}

function Metric({ label, value, icon, tone }) {
  return (
    <div className="bg-white border border-stone-200 rounded-2xl p-4">
      <div className="flex items-center justify-between mb-2">
        <p className="text-xs text-stone-500">{label}</p>
        <Icon name={icon} size={14} className={tone === "danger" ? "text-red-500" : "text-stone-400"} />
      </div>
      <p className="text-2xl font-medium tracking-tight">{value}</p>
    </div>
  );
}

/* ---------- Materias primas ---------- */
function MateriasPrimas({ materias, onNueva, onEliminar }) {
  const [filtro, setFiltro] = useState("todos");
  const filtradas = materias.filter((m) => filtro === "todos" || m.tipo === filtro);
  return (
    <div className="space-y-5">
      <header className="flex items-center justify-between">
        <div>
          <h1 className="text-2xl font-medium tracking-tight">Catálogo de materias primas</h1>
          <p className="text-stone-500 text-sm mt-1">Ingredientes activos y material de empaque, en un catálogo dinámico</p>
        </div>
        <button onClick={onNueva} className="flex items-center gap-1.5 bg-stone-900 text-white text-sm px-3.5 py-2 rounded-lg">

function ModalProducto({ materias, onClose, onSave }) {
  const [nombre, setNombre] = useState("");
  const [presentacion, setPresentacion] = useState("");
  const activos = materias.filter((m) => m.tipo === "activo");
  const empaques = materias.filter((m) => m.tipo === "empaque");
  const [recetaActivos, setRecetaActivos] = useState(activos.length ? [{ materiaId: activos[0].id, cantidad: "" }] : []);
  const [recetaEmpaque, setRecetaEmpaque] = useState(empaques.length ? [{ materiaId: empaques[0].id, cantidad: "" }] : []);
  const inputCls = "w-full text-sm border border-stone-200 rounded-lg px-2.5 py-2 bg-white";

  function lineaSetter(seccion) {
    return seccion === "activo" ? setRecetaActivos : setRecetaEmpaque;
  }
  function actualizarLinea(seccion, i, campo, valor) {
    lineaSetter(seccion)((prev) => prev.map((r, idx) => (idx === i ? { ...r, [campo]: valor } : r)));
  }
  function agregarLinea(seccion) {
    const opciones = seccion === "activo" ? activos : empaques;
    lineaSetter(seccion)((prev) => [...prev, { materiaId: opciones[0]?.id || "", cantidad: "" }]);
  }
  function quitarLinea(seccion, i) {
    lineaSetter(seccion)((prev) => prev.filter((_, idx) => idx !== i));
  }

  function SeccionReceta({ titulo, seccion, lineas, opciones }) {
    return (
      <div className="mb-4">
        <p className="text-xs text-stone-500 mb-1.5">{titulo}</p>
        {opciones.length === 0 && (
          <p className="text-xs text-stone-400 mb-2">No hay materias primas de este tipo en el catálogo todavía.</p>
        )}
        <div className="space-y-2 mb-2">
          {lineas.map((r, i) => (
            <div key={i} className="flex gap-2 items-center">
              <select value={r.materiaId} onChange={(e) => actualizarLinea(seccion, i, "materiaId", Number(e.target.value))} className={inputCls}>
                {opciones.map((m) => (
                  <option key={m.id} value={m.id}>{m.nombre}</option>
                ))}
              </select>
              <input
                type="number"
                value={r.cantidad}
                onChange={(e) => actualizarLinea(seccion, i, "cantidad", e.target.value)}
                className={inputCls}
                style={{ width: "90px" }}
                placeholder="Cant."
              />
              <button onClick={() => quitarLinea(seccion, i)} className="text-stone-400 hover:text-red-600">
                <Icon name="x" size={15} />
              </button>
            </div>
          ))}
        </div>
        {opciones.length > 0 && (
          <button onClick={() => agregarLinea(seccion)} className="text-xs text-stone-500 flex items-center gap-1 hover:text-stone-900">
            <Icon name="plus" size={12} /> Agregar {seccion === "activo" ? "ingrediente activo" : "material de empaque"}
          </button>
        )}
      </div>
    );
  }

  return (
    <Modal onClose={onClose} titulo="Nuevo producto">
      <Field label="Nombre" full>
        <input value={nombre} onChange={(e) => setNombre(e.target.value)} className={inputCls} placeholder="Ej. SLEEPMAX" />
      </Field>
      <Field label="Presentación" full>
        <input value={presentacion} onChange={(e) => setPresentacion(e.target.value)} className={inputCls} placeholder="Ej. Shot líquido 30ml" />
      </Field>

      <SeccionReceta titulo="Ingredientes activos (por unidad producida)" seccion="activo" lineas={recetaActivos} opciones={activos} />
      <SeccionReceta titulo="Material de empaque (por unidad producida)" seccion="empaque" lineas={recetaEmpaque} opciones={empaques} />

      <div className="flex justify-end gap-2">
        <button onClick={onClose} className="text-sm px-3.5 py-2 rounded-lg border border-stone-200">Cancelar</button>
        <button
          onClick={() => {
            if (!nombre) return;
            const limpiar = (r) => r.filter((x) => x.materiaId && x.cantidad).map((x) => ({ materiaId: x.materiaId, cantidad: Number(x.cantidad) }));
            const receta = [...limpiar(recetaActivos), ...limpiar(recetaEmpaque)];
            onSave({ nombre, presentacion, receta });
            onClose();
          }}
          className="text-sm px-3.5 py-2 rounded-lg bg-stone-900 text-white"
        >
          Guardar producto
        </button>
      </div>
    </Modal>
  );
}

function OrdenCard({ orden, producto, rol, onLabProduce, onGlobalConfirma, onLabEnvia, onGlobalRecibeEnvio, onEliminar }) {
  const puedeLab = rol === "lab";
  const puedeGlobal = rol === "global";
  const [cantidadEnvio, setCantidadEnvio] = useState("");

  const enviado = orden.envios.reduce((s, e) => s + e.cantidad, 0);
  const recibido = orden.envios.filter((e) => e.recibido).reduce((s, e) => s + e.cantidad, 0);
  const pendienteEnvio = orden.cantidad - enviado;

  function enviar(cantidad) {
    onLabEnvia(orden, cantidad);
    setCantidadEnvio("");
  }

  return (
    <div className="bg-white border border-stone-200 rounded-2xl p-5">
      <div className="flex items-center justify-between mb-3">
        <div>
          <p className="font-medium">{orden.folio} · {producto?.nombre}</p>
          <p className="text-xs text-stone-500">{fmt(orden.cantidad)} unidades solicitadas</p>
        </div>
        <EstadoBadge estado={orden.estado} />
      </div>

      <div className="flex items-center gap-3 mb-3">
        <PasoConfirmacion label="Lab produce" hecho={orden.confirmLab} />
        <div className="h-px w-6 bg-stone-200" />
        <PasoConfirmacion label="Global confirma lote" hecho={orden.confirmGlobal && orden.estado !== "solicitado" && orden.estado !== "en_lab"} />
      </div>

      {(orden.confirmLab && orden.estado !== "en_lab" && orden.estado !== "producido_pendiente") && (
        <div className="mb-4 bg-stone-50 border border-stone-100 rounded-xl p-3">
          <div className="flex items-center justify-between text-xs text-stone-500 mb-2">
            <span>Enviado: <span className="font-medium text-stone-700">{fmt(enviado)} / {fmt(orden.cantidad)}</span></span>
            <span>Recibido: <span className="font-medium text-stone-700">{fmt(recibido)} / {fmt(orden.cantidad)}</span></span>
          </div>
          {orden.envios.length > 0 && (
            <div className="space-y-1.5 mb-2">
              {orden.envios.map((e) => (
                <div key={e.id} className="flex items-center justify-between text-xs">
                  <span className="text-stone-600">{fmt(e.cantidad)} unidades · enviado {e.fecha}</span>
                  {e.recibido ? (
                    <span className="text-green-700 flex items-center gap-1"><Icon name="check" size={11} /> Recibido {e.fechaRecepcion}</span>
                  ) : puedeGlobal ? (
                    <AccionBtn onClick={() => onGlobalRecibeEnvio(orden, e.id)}>Confirmar recepción</AccionBtn>
                  ) : (
                    <span className="text-amber-700">Pendiente de recepción</span>
                  )}
                </div>
              ))}
            </div>
          )}
          {pendienteEnvio > 0 && puedeLab && (
            <div className="flex items-center gap-2 mt-2">
              <input type="number" value={cantidadEnvio} onChange={(e) => setCantidadEnvio(e.target.value)}
                placeholder={`Máx. ${fmt(pendienteEnvio)}`}
                className="text-xs border border-stone-200 rounded-lg px-2.5 py-1.5 w-32" />
              <button onClick={() => enviar(Number(cantidadEnvio) || 0)}
                disabled={!cantidadEnvio}
                className="text-xs px-3 py-1.5 rounded-lg bg-stone-900 text-white disabled:opacity-30">
                Enviar parcial
              </button>
              <button onClick={() => enviar(pendienteEnvio)} className="text-xs px-3 py-1.5 rounded-lg border border-stone-200">
                Enviar resto ({fmt(pendienteEnvio)})
              </button>
            </div>
          )}
        </div>
      )}

      <div className="flex items-center gap-2 flex-wrap">
        {orden.estado === "en_lab" && puedeLab && <AccionBtn onClick={() => onLabProduce(orden)}>Confirmar producción del lote (Lab)</AccionBtn>}
        {orden.estado === "producido_pendiente" && puedeGlobal && <AccionBtn onClick={() => onGlobalConfirma(orden)}>Confirmar lote recibido en sistema (Global)</AccionBtn>}
        {orden.estado === "completado" && (
          <>
            <p className="text-xs text-green-700 flex items-center gap-1"><Icon name="check" size={13} /> Producción enviada y recibida por completo</p>
            <button onClick={() => onEliminar(orden.id)}
              className="text-xs px-3 py-1.5 rounded-lg border border-red-200 text-red-600 hover:bg-red-50 flex items-center gap-1">
              <Icon name="trash" size={13} /> Eliminar orden
            </button>
          </>
        )}
      </div>

      <details className="mt-3">
        <summary className="text-xs text-stone-400 cursor-pointer">Historial</summary>
        <div className="mt-2 space-y-1">
          {orden.historial.map((h, i) => (
            <p key={i} className="text-xs text-stone-500">{h.fecha} — {h.evento}</p>

        </div>
      </details>
    </div>
  );

  function enviar(cantidad) {
    onLabEnvia(orden, cantidad);
    setCantidadEnvio("");
  }

  return (
    <div className="bg-white border border-stone-200 rounded-2xl p-5">
      <div className="flex items-center justify-between mb-3">
        <div>
          <p className="font-medium">{orden.folio} · {producto?.nombre}</p>
          <p className="text-xs text-stone-500">{fmt(orden.cantidad)} unidades solicitadas por ONANO Global</p>
        </div>
        <EstadoBadge estado={orden.estado} />
      </div>

      {orden.estado === "solicitado" && (
        puedeLab ? (
          <div className="mb-1">
            <AccionBtn onClick={() => onLabConfirma(orden)}>Confirmar solicitud y preparar envío (Lab)</AccionBtn>
          </div>
        ) : (
          <p className="text-xs text-amber-700 mb-1">Esperando confirmación de ONANO Lab</p>
        )
      )}

      {orden.confirmLab && (
        <div className="mt-3 mb-4 bg-stone-50 border border-stone-100 rounded-xl p-3">
          <div className="flex items-center justify-between text-xs text-stone-500 mb-2">
            <span>Enviado: <span className="font-medium text-stone-700">{fmt(enviado)} / {fmt(orden.cantidad)}</span></span>
            <span>Recibido: <span className="font-medium text-stone-700">{fmt(recibido)} / {fmt(orden.cantidad)}</span></span>
          </div>
          {orden.envios.length > 0 && (
            <div className="space-y-1.5 mb-2">
              {orden.envios.map((e) => (
                <div key={e.id} className="flex items-center justify-between text-xs">
                  <span className="text-stone-600">{fmt(e.cantidad)} unidades · enviado {e.fecha}</span>
                  {e.recibido ? (
                    <span className="text-green-700 flex items-center gap-1"><Icon name="check" size={11} /> Recibido {e.fechaRecepcion}</span>
                  ) : puedeGlobal ? (
                    <AccionBtn onClick={() => onGlobalRecibeEnvio(orden, e.id)}>Confirmar recepción</AccionBtn>
                  ) : (
                    <span className="text-amber-700">Pendiente de recepción</span>
                  )}
                </div>
              ))}
            </div>
          )}
          {pendienteEnvio > 0 && puedeLab && (
            <div className="flex items-center gap-2 mt-2">
              <input type="number" value={cantidadEnvio} onChange={(e) => setCantidadEnvio(e.target.value)}
                placeholder={`Máx. ${fmt(pendienteEnvio)}`}
                className="text-xs border border-stone-200 rounded-lg px-2.5 py-1.5 w-32" />
              <button onClick={() => enviar(Number(cantidadEnvio) || 0)}
                disabled={!cantidadEnvio}
                className="text-xs px-3 py-1.5 rounded-lg bg-stone-900 text-white disabled:opacity-30">
                Enviar parcial
              </button>
              <button onClick={() => enviar(pendienteEnvio)} className="text-xs px-3 py-1.5 rounded-lg border border-stone-200">
                Enviar resto ({fmt(pendienteEnvio)})
              </button>
            </div>
          )}
        </div>
      )}

      {orden.estado === "completado" && (
        <div className="flex items-center gap-2 flex-wrap">
          <p className="text-xs text-green-700 flex items-center gap-1"><Icon name="check" size={13} /> Envío completado y recibido en su totalidad</p>
          <button onClick={() => onEliminar(orden.id)}
            className="text-xs px-3 py-1.5 rounded-lg border border-red-200 text-red-600 hover:bg-red-50 flex items-center gap-1">
            <Icon name="trash" size={13} /> Eliminar solicitud
          </button>
        </div>
      )}

      <details className="mt-3">
        <summary className="text-xs text-stone-400 cursor-pointer">Historial</summary>
        <div className="mt-2 space-y-1">
          {orden.historial.map((h, i) => (
            <p key={i} className="text-xs text-stone-500">{h.fecha} — {h.evento}</p>
          ))}
        </div>
      </details>
    </div>
  );
}

function ModalOrdenEnvio({ productos, inventarioPT, onClose, onCrear }) {
  const [productoId, setProductoId] = useState(productos[0]?.id);
  const [cantidad, setCantidad] = useState("");
  const inputCls = "w-full text-sm border border-stone-200 rounded-lg px-2.5 py-2 bg-white";
  const disponible = inventarioPT[productoId] || 0;

  return (
    <Modal onClose={onClose} titulo="Nueva solicitud de envío">
      <Field label="Producto" full>
        <select value={productoId} onChange={(e) => setProductoId(Number(e.target.value))} className={inputCls}>
          {productos.map((p) => <option key={p.id} value={p.id}>{p.nombre}</option>)}
        </select>
      </Field>
      <p className="text-xs text-stone-500 -mt-2 mb-3">Disponible en inventario: {fmt(disponible)} unidades</p>
      <Field label="Cantidad a solicitar" full>
        <input type="number" value={cantidad} onChange={(e) => setCantidad(e.target.value)} className={inputCls} placeholder="Ej. 200" />
      </Field>
      <div className="flex justify-end gap-2 mt-5">
        <button onClick={onClose} className="text-sm px-3.5 py-2 rounded-lg border border-stone-200">Cancelar</button>
        <button onClick={() => { if (!cantidad) return; onCrear(productoId, Number(cantidad)); }}
          className="text-sm px-3.5 py-2 rounded-lg bg-stone-900 text-white">
          Crear solicitud
        </button>
      </div>
    </Modal>
  );
}

/* ---------- Componentes genéricos ---------- */
function Modal({ children, onClose, titulo }) {
  return (
    <div className="fixed inset-0 bg-black/30 flex items-center justify-center z-50 p-4">
      <div className="bg-white rounded-2xl p-6 w-full max-w-md">
        <div className="flex items-center justify-between mb-4">
          <h2 className="font-medium">{titulo}</h2>
          <button onClick={onClose}><Icon name="x" size={18} className="text-stone-400" /></button>
        </div>
        {children}
      </div>
    </div>
  );
}

function Field({ label, children, full }) {
  return (
    <div className={full ? "col-span-2 mb-3" : "mb-3"}>
      <label className="text-xs text-stone-500 mb-1 block">{label}</label>
      {children}
    </div>
  );
}

/* ---------- Login (conectado al backend real) ---------- */
function Login({ apiUrl, setApiUrl, onIngresar, onRegistrar, onOlvide, onRestablecer }) {
  const params = new URLSearchParams(window.location.search);
  const tieneTokenURL = params.get("token") && params.get("email");

  const [modo, setModo] = useState(tieneTokenURL ? "restablecer" : "ingresar");
  const [empresa, setEmpresa] = useState("lab");
  const [email, setEmail] = useState(params.get("email") || "");
  const [password, setPassword] = useState("");
  const [password2, setPassword2] = useState("");
  const [tokenReset, setTokenReset] = useState(params.get("token") || "");
  const [error, setError] = useState("");
  const [mensaje, setMensaje] = useState("");
  const [enlaceDev, setEnlaceDev] = useState(null);
  const [enviando, setEnviando] = useState(false);
  const [mostrarConfig, setMostrarConfig] = useState(false);
  const inputCls = "w-full text-sm border border-stone-200 rounded-lg px-3 py-2 bg-white";

  async function submit() {
    setError(""); setMensaje("");
    if (modo === "ingresar") {
      setEnviando(true);
      const r = await onIngresar({ email, password });
      setEnviando(false);
      if (!r.ok) setError(r.error);
    } else if (modo === "crear") {
      if (!email || !password) { setError("Completa correo y contraseña."); return; }
      if (password.length < 8) { setError("La contraseña debe tener al menos 8 caracteres."); return; }
      if (password !== password2) { setError("Las contraseñas no coinciden."); return; }
      setEnviando(true);
      const r = await onRegistrar({ email, password, empresa });
      setEnviando(false);
      if (!r.ok) setError(r.error);
    } else if (modo === "olvide") {
      if (!email) { setError("Escribe tu correo."); return; }
      setEnviando(true);
      const r = await onOlvide(email);
      setEnviando(false);
      if (!r.ok) { setError(r.error); return; }
      setMensaje(r.mensaje);
      if (r.dev_enlace) setEnlaceDev(r.dev_enlace);
    } else if (modo === "restablecer") {
      if (!tokenReset || !password) { setError("Completa el código y la nueva contraseña."); return; }
      if (password.length < 8) { setError("La contraseña debe tener al menos 8 caracteres."); return; }
      if (password !== password2) { setError("Las contraseñas no coinciden."); return; }
      setEnviando(true);
      const r = await onRestablecer({ email, token: tokenReset, password });
      setEnviando(false);
      if (!r.ok) { setError(r.error); return; }
      setMensaje(r.mensaje + " Ya puedes iniciar sesión.");
      setModo("ingresar");
      setPassword(""); setPassword2(""); setTokenReset("");
    }
  }

  function usarEnlaceDev() {
    try {
      const u = new URL(enlaceDev);
      setTokenReset(u.searchParams.get("token") || "");
      setEmail(u.searchParams.get("email") || email);
      setModo("restablecer");
      setMensaje(""); setEnlaceDev(null);
    } catch (e) {}
  }

  return (
    <div className="min-h-screen bg-stone-50 flex items-center justify-center p-4">
      <div className="bg-white border border-stone-200 rounded-2xl p-7 w-full max-w-sm">
        <p className="text-sm font-medium mb-1">ONANO · Inventario</p>
        <p className="text-xs text-stone-500 mb-5">Acceso exclusivo para ONANO Lab y ONANO Global</p>

        {modo !== "restablecer" && (
          <div className="flex gap-1 mb-5 bg-stone-100 rounded-lg p-1">
            <button onClick={() => { setModo("ingresar"); setError(""); setMensaje(""); }}
              className={`flex-1 text-xs py-1.5 rounded-md ${modo === "ingresar" ? "bg-white shadow-sm font-medium" : "text-stone-500"}`}>
              Iniciar sesión
            </button>
            <button onClick={() => { setModo("crear"); setError(""); setMensaje(""); }}
              className={`flex-1 text-xs py-1.5 rounded-md ${modo === "crear" ? "bg-white shadow-sm font-medium" : "text-stone-500"}`}>
              Crear cuenta
            </button>
          </div>
        )}

        {modo === "crear" && (
          <Field label="Empresa" full>
            <select value={empresa} onChange={(e) => setEmpresa(e.target.value)} className={inputCls}>
              <option value="lab">ONANO Lab</option>
              <option value="global">ONANO Global</option>
            </select>
          </Field>
        )}

        {modo !== "restablecer" && (
          <>
            <Field label="Correo" full>
              <input type="email" value={email} onChange={(e) => setEmail(e.target.value)} className={inputCls} placeholder="tucorreo@onano.com" />
            </Field>
            {modo !== "olvide" && (
              <Field label="Contraseña" full>
                <input type="password" value={password} onChange={(e) => setPassword(e.target.value)} className={inputCls} />
              </Field>
            )}
            {modo === "crear" && (
              <Field label="Confirmar contraseña" full>
                <input type="password" value={password2} onChange={(e) => setPassword2(e.target.value)} className={inputCls} />
              </Field>
            )}
          </>
        )}

        {modo === "restablecer" && (
          <>
            <Field label="Correo" full>
              <input type="email" value={email} onChange={(e) => setEmail(e.target.value)} className={inputCls} />
            </Field>
            <Field label="Código del enlace" full>
              <input value={tokenReset} onChange={(e) => setTokenReset(e.target.value)} className={inputCls} placeholder="Pega aquí el código que recibiste" />
            </Field>
            <Field label="Nueva contraseña" full>
              <input type="password" value={password} onChange={(e) => setPassword(e.target.value)} className={inputCls} />
            </Field>
            <Field label="Confirmar nueva contraseña" full>
              <input type="password" value={password2} onChange={(e) => setPassword2(e.target.value)} className={inputCls} />
            </Field>
          </>
        )}

        {error && <p className="text-xs text-red-600 mb-3">{error}</p>}
        {mensaje && <p className="text-xs text-green-700 mb-3">{mensaje}</p>}

        {modo === "olvide" && enlaceDev && (
          <div className="text-xs bg-amber-50 border border-amber-200 rounded-lg p-3 mb-3">
            <p className="text-amber-800 mb-2">No hay un correo real configurado todavía (modo desarrollo). Usa este enlace para probar el flujo:</p>
            <button onClick={usarEnlaceDev} className="text-xs px-2.5 py-1.5 rounded-lg bg-stone-900 text-white">Usar este enlace ahora</button>
          </div>
        )}

        <button onClick={submit} disabled={enviando}
          className="w-full text-sm px-3.5 py-2 rounded-lg bg-stone-900 text-white mt-1 disabled:opacity-50">
          {enviando ? "Un momento…" :
            modo === "ingresar" ? "Entrar" :
            modo === "crear" ? "Crear cuenta y entrar" :
            modo === "olvide" ? "Enviar enlace de recuperación" :
            "Restablecer contraseña"}
        </button>

        <div className="flex items-center justify-between mt-3">
          {modo === "ingresar" && (
            <button onClick={() => { setModo("olvide"); setError(""); setMensaje(""); }} className="text-xs text-stone-500 hover:text-stone-900">
              ¿Olvidaste tu contraseña?
            </button>
          )}
          {(modo === "olvide" || modo === "restablecer") && (
            <button onClick={() => { setModo("ingresar"); setError(""); setMensaje(""); }} className="text-xs text-stone-500 hover:text-stone-900">
              Volver a iniciar sesión
            </button>
          )}
        </div>

        <div className="mt-5 pt-4 border-t border-stone-100">
          <button onClick={() => setMostrarConfig((v) => !v)} className="text-xs text-stone-400 hover:text-stone-600">
            {mostrarConfig ? "Ocultar" : "Configurar"} dirección del servidor
          </button>
          {mostrarConfig && (
            <input value={apiUrl} onChange={(e) => setApiUrl(e.target.value)} className={inputCls + " mt-2"} placeholder="http://localhost:4000/api" />
          )}
        </div>

        <p className="text-xs text-stone-400 mt-4 leading-relaxed">
          Cuentas de prueba (creadas por <code>npm run seed</code>):<br />
          lab@onano.com / onanolab2026<br />
          global@onano.com / onanoglobal2026
        </p>
      </div>
    </div>
  );
}
